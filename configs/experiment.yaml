project:
  seed: 2026
  max_gpus: 4
  image_size: 224
  cache_dtype: float16
  compile_tail: false
  allow_tf32: true

paths:
  data_dir: data
  model_dir: model
  cache_dir: cache
  results_dir: results

models:
  convnext_id: facebook/dinov3-convnext-tiny-pretrain-lvd1689m
  vit_id: facebook/dinov3-vits16-pretrain-lvd1689m
  convnext_local: model/dinov3_convnext_tiny
  vit_local: model/dinov3_vits16
  hidden_dim: 384
  num_prefix_tokens: 5

# BMAD reorganized dataset names. Folder matching is case-insensitive.
data:
  datasets: [Brain, liver, RESC, OCT2017, RSNA, camelyon16]
  modality_map:
    Brain: brain_mri
    liver: liver_ct
    RESC: oct
    OCT2017: oct
    RSNA: chest_xray
    camelyon16: pathology
  # Cache all test images, but only a deterministic normal subset of each train split.
  cache_train_limit_per_dataset: 2500
  perturb_samples_per_dataset: 256
  auto_extract_archives: true
  extensions: [.png, .jpg, .jpeg, .bmp, .tif, .tiff]

cache:
  batch_size: 64
  num_workers: 4
  prefetch_factor: 3

screen:
  source_stages: [1, 2, 3]
  target_blocks: [3, 6, 9]
  seed: 11
  n_per_source_modality: 500
  epochs: 4
  batch_size: 128
  lr: 0.002
  weight_decay: 0.0001
  adapter: mlp
  topk_fraction: 0.05

final:
  top_configs: 2
  seeds: [11, 22, 33]
  n_per_source_modality: 1000
  epochs: 8
  batch_size: 128
  lr: 0.001
  weight_decay: 0.0001
  adapter: mlp
  topk_fraction: 0.05

ablation:
  enabled: true
  seed: 11
  calibration_sizes: [250, 500, 1000, 2000]
  adapter_types: [linear, mlp]
  score_modes: [raw_topk, contrast_topk, robust_topk]
  epochs: 6
  batch_size: 128
  lr: 0.001
  weight_decay: 0.0001

runtime:
  amp: true
  pin_memory: true
  deterministic: false
