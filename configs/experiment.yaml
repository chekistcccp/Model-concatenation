project:
  seed: 2026
  max_gpus: 4
  image_size: 224
  cache_dtype: float16
  compile_tail: false
  allow_tf32: true

paths:
  data_dir: data
  model_dir: model
  cache_dir: cache
  results_dir: results

models:
  auto_download_missing: true
  primary_source: medical
  primary_target: medical

  # CNN: same ResNet50 family, medical vs general pretraining.
  sources:
    medical:
      kind: radimagenet_resnet50
      manual: true
      checkpoint: model/radimagenet_resnet50/resnet50_torch.pt
      input_size: 224
      channel_order: bgr
      normalization_mean: [0.5, 0.5, 0.5]
      normalization_std: [0.5, 0.5, 0.5]
      stage_channels: [512, 1024, 2048]
      note: "MANUAL: official RadImageNet ResNet50 from Google Drive"
    general:
      kind: timm_resnet50
      manual: false
      repo_id: timm/resnet50.a1_in1k
      local: model/resnet50_a1_in1k
      architecture: resnet50.a1_in1k
      input_size: 224
      channel_order: rgb
      normalization_mean: [0.485, 0.456, 0.406]
      normalization_std: [0.229, 0.224, 0.225]
      stage_channels: [512, 1024, 2048]
      note: "AUTO: ModelScope ImageNet-1K ResNet50 A1 control"

  # Transformer: same DINOv2-Base / ViT-B14 family, medical vs general pretraining.
  targets:
    medical:
      kind: dinov2_hf
      manual: false
      repo_id: microsoft/rad-dino
      local: model/rad_dino
      input_size: 224
      native_training_size: 518
      patch_size: 14
      hidden_dim: 768
      normalization_mean: [0.5307, 0.5307, 0.5307]
      normalization_std: [0.2583, 0.2583, 0.2583]
      note: "AUTO: ModelScope RAD-DINO medical DINOv2-Base"
    general:
      kind: dinov2_hf
      manual: false
      repo_id: facebook/dinov2-base
      local: model/dinov2_base
      input_size: 224
      native_training_size: 518
      patch_size: 14
      hidden_dim: 768
      normalization_mean: [0.485, 0.456, 0.406]
      normalization_std: [0.229, 0.224, 0.225]
      note: "AUTO: ModelScope DINOv2-Base general control"

  pairs:
    - [medical, medical]
    - [medical, general]
    - [general, medical]
    - [general, general]

data:
  preferred_subdir: BMAD
  datasets: [Brain, liver, RESC, OCT2017, RSNA, camelyon16]
  modality_map:
    Brain: brain_mri
    liver: liver_ct
    RESC: oct
    OCT2017: oct
    RSNA: chest_xray
    camelyon16: pathology
  cache_train_limit_per_dataset: 2500
  perturb_samples_per_dataset: 256
  auto_extract_archives: true
  extensions: [.png, .jpg, .jpeg, .bmp, .tif, .tiff]

cache:
  batch_size: 32
  num_workers: 4
  prefetch_factor: 3

screen:
  source_stages: [1, 2, 3]
  target_blocks: [3, 6, 9]
  seed: 11
  n_per_source_modality: 500
  epochs: 4
  batch_size: 64
  lr: 0.002
  weight_decay: 0.0001
  adapter: mlp
  topk_fraction: 0.05

final:
  top_configs_per_pair: 1
  seeds: [11, 22, 33]
  n_per_source_modality: 1000
  epochs: 8
  batch_size: 64
  lr: 0.001
  weight_decay: 0.0001
  adapter: mlp
  topk_fraction: 0.05

ablation:
  enabled: true
  source_name: medical
  target_name: medical
  seed: 11
  calibration_sizes: [250, 500, 1000, 2000]
  adapter_types: [linear, mlp]
  score_modes: [raw_topk, contrast_topk, robust_topk]
  epochs: 6
  batch_size: 64
  lr: 0.001
  weight_decay: 0.0001

runtime:
  amp: true
  pin_memory: true
  deterministic: false
