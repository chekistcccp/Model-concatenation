project:
  seed: 2026
  max_gpus: 4
  image_size: 224
  cache_dtype: float16
  compile_tail: false
  allow_tf32: true

paths:
  data_dir: data
  model_dir: model
  cache_dir: cache
  results_dir: results

models:
  # All four checkpoints are prepared manually for reproducibility/offline use.
  manual_only: true
  primary_source: medical
  primary_target: medical

  # Same CNN architecture, different pretraining domain.
  sources:
    medical:
      kind: radimagenet_resnet50
      checkpoint: model/radimagenet_resnet50/resnet50_torch.pt
      input_size: 224
      channel_order: bgr
      normalization_mean: [0.5, 0.5, 0.5]
      normalization_std: [0.5, 0.5, 0.5]
      stage_channels: [512, 1024, 2048]
      note: "RadImageNet supervised ResNet50; official PyTorch backbone weights"
    general:
      kind: imagenet_resnet50
      checkpoint: model/imagenet_resnet50/resnet50-11ad3fa6.pth
      input_size: 224
      channel_order: rgb
      normalization_mean: [0.485, 0.456, 0.406]
      normalization_std: [0.229, 0.224, 0.225]
      stage_channels: [512, 1024, 2048]
      note: "TorchVision ImageNet-1K V2 ResNet50 control"

  # Same Transformer architecture, different pretraining domain.
  targets:
    medical:
      kind: timm_vit
      architecture: vit_small_patch16_224
      directory: model/radiodino_s16
      config: model/radiodino_s16/config.json
      checkpoint: model/radiodino_s16/model.safetensors
      input_size: 224
      patch_size: 16
      hidden_dim: 384
      normalization_mean: [0.485, 0.456, 0.406]
      normalization_std: [0.229, 0.224, 0.225]
      note: "RadioDINO-S/16; RadImageNet medical self-supervised ViT-S/16"
    general:
      kind: timm_vit
      architecture: vit_small_patch16_224
      directory: model/dino_vits16
      config: model/dino_vits16/config.json
      checkpoint: model/dino_vits16/model.safetensors
      input_size: 224
      patch_size: 16
      hidden_dim: 384
      normalization_mean: [0.485, 0.456, 0.406]
      normalization_std: [0.229, 0.224, 0.225]
      note: "ImageNet DINO ViT-S/16 control"

  # 2x2 factorial design: source-domain pretraining x target-domain pretraining.
  pairs:
    - [medical, medical]
    - [medical, general]
    - [general, medical]
    - [general, general]

data:
  preferred_subdir: BMAD
  datasets: [Brain, liver, RESC, OCT2017, RSNA, camelyon16]
  modality_map:
    Brain: brain_mri
    liver: liver_ct
    RESC: oct
    OCT2017: oct
    RSNA: chest_xray
    camelyon16: pathology
  cache_train_limit_per_dataset: 2500
  perturb_samples_per_dataset: 256
  auto_extract_archives: true
  extensions: [.png, .jpg, .jpeg, .bmp, .tif, .tiff]

cache:
  batch_size: 48
  num_workers: 4
  prefetch_factor: 3

screen:
  source_stages: [1, 2, 3]
  target_blocks: [3, 6, 9]
  seed: 11
  n_per_source_modality: 500
  epochs: 4
  batch_size: 96
  lr: 0.002
  weight_decay: 0.0001
  adapter: mlp
  topk_fraction: 0.05

final:
  # One AOSS-selected stitch point per pretraining pair minimizes wall-clock time.
  top_configs_per_pair: 1
  seeds: [11, 22, 33]
  n_per_source_modality: 1000
  epochs: 8
  batch_size: 96
  lr: 0.001
  weight_decay: 0.0001
  adapter: mlp
  topk_fraction: 0.05

ablation:
  enabled: true
  source_name: medical
  target_name: medical
  seed: 11
  calibration_sizes: [250, 500, 1000, 2000]
  adapter_types: [linear, mlp]
  score_modes: [raw_topk, contrast_topk, robust_topk]
  epochs: 6
  batch_size: 96
  lr: 0.001
  weight_decay: 0.0001

runtime:
  amp: true
  pin_memory: true
  deterministic: false
